; SenseForge user overrides — Clair Obscur: Expedition 33 (SF-11b)
[AdaptiveTriggers]
left_trigger_intensity=3
right_trigger_intensity=3
disable_in_menus=true

[ControllerSpeaker]
speaker_volume=0.75

[Haptics]
custom_haptic_gain=1.0
soft_limiter_ceiling=0.92
suppress_xinput_rumble=true

[Lighting]
lightbar_mode=1
lightbar_brightness=1
player_leds_mode=2

[Categories]
ui=true
combat=true
movement=true

[Events]
; UE4SS Lua bridge port (SF-12b): parry/gradient/dodge flashes + persistent
; gameplay states ({"type":"sf_flash"|"sf_state", "id":.., ...})
udp_port=6970

[Runtime]
; E33 has no anti-tamper: a short warmup suffices
warmup_delay_ms=15000
; overlay is DX11-present based; E33 runs D3D12 — keep off until the DX12
; overlay lands (SF-6 roadmap)
enable_overlay=false
enable_audio=true
; E33 reads the DualSense via HID/Steam Input, not XInput
enable_xinput_hook=false

[Dev]
; sf-agent (ferramenta de dev): 1 = o runtime acorda a tarefa SenseForgeAgent
; enquanto o jogo roda (schtasks /run, sem janela). Manter 0 em releases.
agent_autostart=0
; SF-17: 1 = shows the "Criador de MOD" section in the ReShade SenseForge tab
; (live event feed, bindings, manifest reload/problems, fire any event).
creator_tools=0

[SenseForge]
; SF-14: managed by the "SenseForge" tab of the ReShade overlay (Home key).
; enabled=false is the "Desligado" preset (neutral controller, no flashes,
; muted audio). active_preset = 1-3; profile: 0 custom, 1 Fraco, 2 Medio,
; 3 Forte. Each preset keeps its own copy of every setting in [Preset.N].
enabled=true
active_preset=1

; [States] <state_id>_enabled / _left_force / _right_force (1-8, 0 = manifest)
; [EventEffects] <event_id>_enabled / _intensity (0-150 %) / _lightbar
; Both are written by the panel; absent keys keep the manifest behaviour.
