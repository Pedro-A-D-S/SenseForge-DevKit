# SF-15: build + tests + manifest validation + a package of EVERY MOD
# (draft or ready) on each PR and on main, so a MOD in development breaks
# the build early. The zips are kept as workflow artifacts only; nothing is
# published from here.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Security preflight
        shell: bash
        run: python -I tools/security/preflight.py

      - name: Packaging tests
        shell: bash
        run: python -I tools/mods/test_package_mod.py

      - name: Cache third-party sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\senseforge\third_party
          key: third-party-${{ hashFiles('tools/fetch_third_party.sh', 'runtime-asi/third_party_patches/**') }}

      - name: Fetch third-party (pinned)
        shell: bash
        run: bash tools/fetch_third_party.sh

      - name: Build runtime (Release)
        shell: bash
        run: |
          cmake -S runtime-asi -B runtime-asi/build
          cmake --build runtime-asi/build --config Release

      - name: Unit tests
        shell: bash
        run: ctest --test-dir runtime-asi/build -C Release --output-on-failure

      - name: Validate MOD manifests
        shell: bash
        run: |
          for slug in $(python -I tools/mods/package_mod.py --list); do
            for manifest in $(python -I -c "import json,sys; m=json.load(open('mods/'+sys.argv[1]+'/mod.json',encoding='utf-8')); print(' '.join(f['from'] for f in m['files'] if f['from'].endswith('.sense.json')))" "$slug"); do
              echo "== $slug: $manifest"
              runtime-asi/build/Release/sf_manifest_check.exe "$manifest"
            done
          done

      - name: Cache MOD dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/mod-deps
          key: mod-deps-${{ hashFiles('mods/*/mod.json') }}

      - name: Package every MOD
        shell: bash
        run: |
          for slug in $(python -I tools/mods/package_mod.py --list); do
            build_dir="$(bash tools/mods/build_mod.sh "$slug" | tail -n 1)"
            python -I tools/mods/package_mod.py "$slug" --build-dir "$build_dir"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: senseforge-mods
          path: dist/
          retention-days: 14
